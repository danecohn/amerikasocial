name: Review an existing iPhone simulator build
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Xcode-signed iPhone simulator build run to review
        required: true
permissions:
  actions: read
  contents: read
jobs:
  review:
    runs-on: macos-latest
    timeout-minutes: 12
    env:
      CI: '1'
      GH_TOKEN: ${{ github.token }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v6
        with:
          version: '11.25.0'
      - name: Download the compiled app
        run: |
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          BUILD_SHA=$(gh run view "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)
          [[ "$BUILD_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          git fetch origin "$BUILD_SHA" --depth=1
          git diff --exit-code "$BUILD_SHA" HEAD -- pnpm-lock.yaml app.json
          gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name Amerika-Social-iPhone-simulator --dir source-build
          unzip -q source-build/AmerikaSocial-simulator.zip -d simulator-build
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm check:jsx && pnpm test
      - name: Embed the current interface into the compatible native build
        run: |
          pnpm exec expo export:embed --entry-file index.ts --platform ios --dev false --bytecode --bundle-output simulator-build/AmerikaSocial.app/main.jsbundle --assets-dest simulator-build/AmerikaSocial.app
          codesign --force --sign - --preserve-metadata=entitlements,flags,identifier simulator-build/AmerikaSocial.app
      - name: Boot iPhone and capture the running app
        timeout-minutes: 9
        run: |
          xcrun simctl list devices available -j > simulators.json
          DEVICE_ID=$(node -e 'const all=Object.entries(require("./simulators.json").devices).filter(([key,rows])=>key.includes("iOS")&&rows.some(d=>d.isAvailable&&d.name.startsWith("iPhone"))).sort(([a],[b])=>b.localeCompare(a,"en",{numeric:true}));process.stdout.write(all[0][1].find(d=>d.isAvailable&&d.name.startsWith("iPhone")).udid);')
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b > boot.log 2>&1 &
          boot_wait_pid=$!
          for attempt in {1..90}; do
            if ! kill -0 "$boot_wait_pid" 2>/dev/null; then break; fi
            sleep 4
          done
          if kill -0 "$boot_wait_pid" 2>/dev/null; then kill "$boot_wait_pid"; cat boot.log; exit 1; fi
          wait "$boot_wait_pid"
          xcrun simctl install "$DEVICE_ID" simulator-build/AmerikaSocial.app
          xcrun simctl launch --terminate-running-process "$DEVICE_ID" social.amerika.ios
          sleep 15
          xcrun simctl io "$DEVICE_ID" screenshot simulator-review.png
          swift scripts/check-simulator-screen.swift simulator-review.png
          ditto -c -k --sequesterRsrc --keepParent simulator-build/AmerikaSocial.app AmerikaSocial-current-simulator.zip
      - name: Upload review and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Amerika-Social-simulator-review
          path: |
            simulator-review.png
            AmerikaSocial-current-simulator.zip
            boot.log
            simulators.json
          retention-days: 7
