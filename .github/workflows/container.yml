name: Build production image
on:
  push:
    branches: [main]
    paths: ['Dockerfile', '**.mjs', 'package*.json', 'public/**', 'scripts/**', 'certificates/**', 'geo/**', '.github/workflows/container.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: social-production-image
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/danecohn/amerikasocial:latest
            ghcr.io/danecohn/amerikasocial:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
