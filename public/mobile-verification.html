<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="same-origin"><title>Makk Social human verification</title><style>body{margin:0;background:#161617;color:white;font:15px system-ui;display:grid;place-content:center;min-height:120px}#status{text-align:center;padding:8px}</style></head>
<body><div id="challenge"></div><div id="status">Loading human verification…</div><script>
const send=value=>window.ReactNativeWebView?.postMessage(JSON.stringify(value));
async function ready(){try{const config=await(await fetch('/api/config',{credentials:'include'})).json();const action=new URLSearchParams(location.search).get('action');if(!['human-login','human-register'].includes(action))throw Error('Invalid verification action.');if(!config.captcha.enabled){send({disabled:true});document.getElementById('status').textContent='Human verification is not enabled on this server.';return;}if(!config.captcha.siteKey)throw Error('Verification is unavailable.');turnstile.render('#challenge',{sitekey:config.captcha.siteKey,action,theme:'dark',callback:token=>{send({token});document.getElementById('status').textContent='Verification complete';},'expired-callback':()=>send({expired:true}),'error-callback':()=>{send({error:'Verification failed. Please retry.'});return true;}});document.getElementById('status').textContent='';}catch(error){document.getElementById('status').textContent=error.message;send({error:error.message});}}
</script><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=ready&render=explicit" async defer></script></body></html>
