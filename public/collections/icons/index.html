<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VigilTech icons</title><link rel="stylesheet" href="css/vigilsans.css">
<style>:root{--pink:#ff0058;--bg:#140812;--panel:#22101c;--ink:#fff4f8;--dim:#c9a3b4;--line:#ffffff1f;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Vigil Sans",-apple-system,sans-serif}
main,header{max-width:1100px;margin:0 auto;padding:0 20px}header{padding-top:48px}h1{font-size:clamp(2rem,6vw,3rem);margin:.2em 0}h1 b{color:var(--pink)}.lead{color:var(--dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:24px 16px;margin:28px 0 60px}.p{text-align:center}.p img{width:100%;display:block}.p b{display:block;margin-top:6px;font-size:.9rem}.p small{color:var(--dim);display:block;font-size:.72rem;line-height:1.3}a{color:inherit;text-decoration:none}</style></head><body>
<header><h1>VigilTech <b>icons</b></h1><p class="lead">One icon for every product and repo. Each has a full kit: desktop, web, Android and iOS. See <a href="USE.md" style="color:var(--pink)">USE.md</a>. Free software, GNU GPL v3.</p></header><main><div class="grid" id="g"></div></main>
<script>fetch("products.json").then(r=>r.json()).then(l=>{document.getElementById("g").innerHTML=l.map(p=>`<a class="p" href="products/${p.id}/"><img loading="lazy" alt="${p.name}" src="products/${p.id}/desktop/${p.id}-512.png"><b>${p.name}</b><small>${p.repos.join(", ")||"&nbsp;"}</small></a>`).join("")})</script></body></html>
