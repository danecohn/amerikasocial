# Template only. Not installed under .github/workflows and not run remotely.
# GUI/native packaging gates require a disposable Ubuntu 26.10 ARM64 environment.
name: Amerika source checks
on: workflow_dispatch
jobs:
  logic:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-4.0
      - run: python3 -m unittest discover -s tests -q
      - run: python3 -m compileall -q src tools tests
