# xdg-desktop-portal configuration for the Amerika session (XDG_CURRENT_DESKTOP=Amerika).
# KWin provides screen casting, remote desktop, screenshots and global shortcuts through the KDE portal backend;
# the GTK backend handles pickers and printing for GTK applications. See portals.conf(5).
[preferred]
default=kde;gtk
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.AppChooser=gtk
org.freedesktop.impl.portal.Print=gtk
org.freedesktop.impl.portal.Notification=gtk
org.freedesktop.impl.portal.Inhibit=kde
org.freedesktop.impl.portal.ScreenCast=kde
org.freedesktop.impl.portal.RemoteDesktop=kde
org.freedesktop.impl.portal.Screenshot=kde
org.freedesktop.impl.portal.GlobalShortcuts=kde
org.freedesktop.impl.portal.InputCapture=kde
org.freedesktop.impl.portal.Settings=kde;gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
