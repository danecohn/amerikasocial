# Amerika game-development tuning (apply with: amerika-hw tune apply, undo with: amerika-hw tune revert)
# Big projects (Godot, Blender, Unreal-style trees) watch many files and map many memory regions.
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
vm.max_map_count = 1048576
# Prefer compressed RAM (zram) over disk swap and keep the page cache warm.
vm.swappiness = 150
vm.page-cluster = 0
vm.watermark_boost_factor = 0
vm.vfs_cache_pressure = 50
